# PR / develop: quality gates + docker build (no push).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Cover (≥80%)
        run: npm run cover

      - name: Build
        env:
          PUBLIC_GFIREUI_API_BASE: http://127.0.0.1:8090
        run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gfireui:ci
          build-args: |
            PUBLIC_GFIREUI_API_BASE=http://127.0.0.1:8090
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
